<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chúc Mừng Sinh Nhật 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     THIẾT KẾ: Liquid Glass (kiểu iOS 26)
     - Nền pastel nhiều lớp blob trôi nhẹ
     - Mọi khối UI: kính mờ (backdrop-filter blur) + viền sáng + bóng mềm
     - Chữ vàng script "uốn lượn" tự vẽ từ trái sang phải
     - 3 nút xếp chồng góc phải trên -> khi bấm trượt ra giữa & phóng to
     - Bánh kem giữa màn -> bấm mở form gửi lời chúc kiểu liquid glass
     - Hiệu ứng trái tim & bong bóng trắng rơi nhẹ nhàng
     ============================================================ */

  :root{
    --glass: rgba(255,255,255,0.5);
    --glass-strong: rgba(255,255,255,0.72);
    --glass-border: rgba(255,255,255,0.85);
    --text-dark: #3a3540;
    --text-soft: #6b6470;
    --gold-1:#fdf1c8;
    --gold-2:#f7c948;
    --gold-3:#c99a2e;
    --shadow-soft: 0 8px 32px rgba(140,120,160,0.18);
    --shadow-strong: 0 20px 60px rgba(140,120,160,0.28);
    --radius-lg: 28px;
    --radius-md: 20px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--text-dark);
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- NỀN GRADIENT NHIỀU LỚP (kiểu iOS 26 wallpaper) ---------- */
  .bg{
    position:fixed; inset:0; z-index:-3;
    background: linear-gradient(135deg,#fffaf5 0%, #fff0f5 45%, #f2f0ff 100%);
  }
  .blob{
    position:fixed; z-index:-2;
    border-radius:50%;
    filter: blur(70px);
    opacity:.55;
    pointer-events:none;
    animation: drift 22s ease-in-out infinite;
  }
  .blob1{ width:520px; height:520px; top:-160px; left:-140px; background:#ffd6e8; animation-delay:0s; }
  .blob2{ width:480px; height:480px; bottom:-180px; right:-140px; background:#d8e8ff; animation-delay:-6s; }
  .blob3{ width:420px; height:420px; top:30%; right:10%; background:#fff2cf; animation-delay:-12s; }
  .blob4{ width:360px; height:360px; bottom:10%; left:5%; background:#e8dcff; animation-delay:-18s; }

  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(40px,-30px) scale(1.08); }
    66%{ transform:translate(-30px,25px) scale(0.95); }
  }

  /* ---------- HẠT TRÔI: trái tim & bong bóng trắng ---------- */
  .ambient{ position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
  .particle{ position:absolute; top:-10vh; will-change:transform,opacity; }
  @keyframes fall{
    from{ transform: translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:.85; }
    to{ transform: translateY(115vh) translateX(var(--drift)) rotate(var(--spin)); opacity:0; }
  }

  /* ============================================================
     LỚP KÍNH DÙNG CHUNG
     ============================================================ */
  .glass{
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow:
      var(--shadow-soft),
      inset 0 1px 1px rgba(255,255,255,0.9),
      inset 0 -1px 12px rgba(255,255,255,0.4);
  }

  /* ============================================================
     CỔNG VÀO: nhập tên trước khi vào tiệc
     ============================================================ */
  .gate{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(30px) saturate(150%);
    -webkit-backdrop-filter: blur(30px) saturate(150%);
    transition: opacity .6s ease, visibility .6s ease;
  }
  .gate.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .gate-card{
    width:min(420px, 88vw);
    padding:48px 36px 38px;
    border-radius: var(--radius-lg);
    text-align:center;
    animation: pop-in .7s cubic-bezier(.2,.9,.25,1.2);
  }
  @keyframes pop-in{
    from{ opacity:0; transform: translateY(24px) scale(.94); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .gate-emoji{ font-size:52px; margin-bottom:6px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.08)); }
  .gate-card h1{
    font-size:22px; font-weight:700; margin-bottom:6px; color:var(--text-dark);
  }
  .gate-card p{ font-size:14px; color:var(--text-soft); margin-bottom:22px; }

  .field{
    width:100%;
    padding:14px 18px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    font-family:inherit;
    font-size:15px;
    color:var(--text-dark);
    outline:none;
    transition: box-shadow .25s ease, border-color .25s ease;
    margin-bottom:16px;
  }
  .field::placeholder{ color:#a49dab; }
  .field:focus{ border-color: var(--gold-2); box-shadow:0 0 0 4px rgba(247,201,72,0.25); }

  textarea.field{ resize:none; min-height:96px; font-family:inherit; }

  .btn-primary{
    width:100%;
    padding:14px 20px;
    border:none;
    border-radius:16px;
    font-family:inherit;
    font-weight:600;
    font-size:15px;
    color:#4a3a1a;
    cursor:pointer;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    box-shadow: 0 10px 24px rgba(247,201,72,0.4), inset 0 1px 1px rgba(255,255,255,0.8);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease;
  }
  .btn-primary:hover{ transform: translateY(-3px); box-shadow: 0 16px 32px rgba(247,201,72,0.5); }
  .btn-primary:active{ transform: translateY(0px) scale(.98); }

  /* ============================================================
     ỨNG DỤNG CHÍNH
     ============================================================ */
  .app{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- 3 nút xếp chồng góc trên phải ---- */
  .stack{
    position:fixed;
    top:26px; right:26px;
    z-index:30;
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:flex-end;
  }
  .stack-btn{
    width:220px;
    padding:15px 20px;
    border-radius:18px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    color:var(--text-dark);
    text-align:left;
    cursor:pointer;
    transform: translateX(calc(var(--i) * 6px)) rotate(calc(var(--i) * -1.6deg));
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease, opacity .3s ease;
  }
  .stack-btn:hover{
    transform: translateY(-4px) translateX(calc(var(--i) * 6px)) rotate(0deg) scale(1.03);
    box-shadow: var(--shadow-strong), inset 0 1px 1px rgba(255,255,255,0.9);
  }
  .stack-btn .ico{ font-size:18px; }
  .stack-btn.launching{ opacity:0; pointer-events:none; }

  /* ---- Khu vực chính giữa ---- */
  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    padding: 20px 20px 60px;
    text-align:center;
  }

  .headline-wrap{ overflow:visible; }
  .gold-text{
    font-family:'Great Vibes', cursive;
    font-weight:400;
    font-size: clamp(2.6rem, 8vw, 5.4rem);
    line-height:1.1;
    background: linear-gradient(90deg, var(--gold-3), var(--gold-2) 25%, #fff6d8 50%, var(--gold-2) 75%, var(--gold-3));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 18px rgba(201,154,46,0.25));
    display:inline-block;
    clip-path: inset(0 100% 0 0);
    animation:
      draw 2.4s cubic-bezier(.65,0,.35,1) .3s forwards,
      shine 5s linear 2.7s infinite;
  }
  @keyframes draw{ to{ clip-path: inset(0 0% 0 0); } }
  @keyframes shine{ 0%{ background-position:0% 50%; } 100%{ background-position:300% 50%; } }

  .subtitle{
    font-size:15px;
    color:var(--text-soft);
    letter-spacing:.5px;
    opacity:0;
    animation: fade-up .8s ease 2.6s forwards;
  }
  @keyframes fade-up{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  /* ---- Bánh kem giữa màn ---- */
  .cake-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
    user-select:none;
  }
  .cake{
    font-size: clamp(64px, 14vw, 108px);
    filter: drop-shadow(0 18px 30px rgba(160,120,90,0.28));
    animation: bob 3.2s ease-in-out infinite;
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .cake-wrap:hover .cake{ transform: scale(1.08) rotate(-2deg); }
  .cake-wrap:active .cake{ transform: scale(.96); }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
  .cake-hint{
    font-size:13px;
    color:var(--text-soft);
    padding:8px 16px;
    border-radius:999px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    border:1px solid var(--glass-border);
  }

  /* ---- Đếm ngược ---- */
  .countdown{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .cd-box{
    width:76px;
    padding:14px 0 10px;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .cd-num{ font-size:26px; font-weight:800; color:var(--text-dark); font-variant-numeric: tabular-nums; }
  .cd-label{ font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--text-soft); }
  .cd-target{ font-size:12px; color:var(--text-soft); margin-top:2px; }

  /* ============================================================
     MODAL: từ nút bay trượt ra giữa & phóng to (Liquid Glass)
     ============================================================ */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(120,110,140,0.18);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index:40;
    opacity:0; visibility:hidden;
    transition: opacity .4s ease, visibility .4s ease;
  }
  .modal-overlay.show{ opacity:1; visibility:visible; }

  .modal-panel{
    position:fixed;
    z-index:41;
    border-radius:20px;
    overflow:hidden;
    opacity:0;
    visibility:hidden;
    background: var(--glass-strong);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow-strong), inset 0 1px 1px rgba(255,255,255,0.9);
  }
  .modal-panel.show{ opacity:1; visibility:visible; }

  .modal-inner{
    height:100%;
    display:flex;
    flex-direction:column;
    padding:28px 26px 22px;
    overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:16px; right:16px;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--glass-border);
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:16px;
    color:var(--text-soft);
    transition: transform .2s ease, background .2s ease;
  }
  .modal-close:hover{ transform: rotate(90deg); background: rgba(255,255,255,0.85); }

  .modal-title{ font-size:20px; font-weight:700; margin-bottom:4px; }
  .modal-sub{ font-size:13px; color:var(--text-soft); margin-bottom:20px; }

  /* Hồ sơ */
  .profile-avatar{
    width:84px; height:84px; border-radius:50%;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    display:flex; align-items:center; justify-content:center;
    font-size:36px;
    margin: 0 auto 14px;
    box-shadow: 0 10px 24px rgba(247,201,72,0.35);
  }
  .profile-name{ text-align:center; font-size:18px; font-weight:700; }
  .profile-role{ text-align:center; font-size:13px; color:var(--text-soft); margin-bottom:18px; }
  .profile-line{
    display:flex; justify-content:space-between;
    padding:12px 0; font-size:13.5px;
    border-bottom:1px solid rgba(0,0,0,0.06);
  }
  .profile-line span:first-child{ color:var(--text-soft); }
  .profile-line span:last-child{ font-weight:600; }

  /* Lời chúc */
  .wish-form{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .wish-list{ display:flex; flex-direction:column; gap:10px; }
  .wish-item{
    padding:14px 16px;
    border-radius:16px;
    background: rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.8);
  }
  .wish-name{ font-size:13px; font-weight:700; margin-bottom:4px; color:var(--gold-3); }
  .wish-msg{ font-size:13.5px; color:var(--text-dark); line-height:1.5; }
  .wish-empty{ text-align:center; color:var(--text-soft); font-size:13px; padding:20px 0; }

  /* Khoảnh khắc / album */
  .gallery{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .gallery-card{
    aspect-ratio: 1;
    border-radius:16px;
    display:flex; align-items:flex-end;
    padding:10px;
    font-size:12px; font-weight:600; color:#fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .g1{ background: linear-gradient(135deg,#ffb6c1,#ff8fab); }
  .g2{ background: linear-gradient(135deg,#a8d8ff,#7cb9ff); }
  .g3{ background: linear-gradient(135deg,#ffe08a,#ffc857); }
  .g4{ background: linear-gradient(135deg,#c9b6ff,#a78bfa); }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px){
    .stack{ top:16px; right:16px; }
    .stack-btn{ width:180px; padding:12px 16px; font-size:13px; }
    .cd-box{ width:64px; padding:10px 0 8px; }
    .cd-num{ font-size:20px; }
    .gallery{ grid-template-columns: 1fr 1fr; }
    .modal-inner{ padding:24px 18px 18px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>

  <div class="ambient" id="ambient"></div>

  <!-- ============ CỔNG VÀO ============ -->
  <div class="gate" id="gate">
    <div class="gate-card glass">
      <div class="gate-emoji">🎉</div>
      <h1>Chào mừng đến bữa tiệc!</h1>
      <p>Nhập tên của bạn để bước vào nhé</p>
      <input class="field" id="guestNameInput" type="text" placeholder="Tên của bạn..." maxlength="30" />
      <button class="btn-primary" id="enterBtn">Bước Vào Bữa Tiệc ✨</button>
    </div>
  </div>

  <!-- ============ ỨNG DỤNG CHÍNH ============ -->
  <div class="app" id="app">

    <div class="stack" id="stack">
      <button class="stack-btn glass" data-panel="profile" style="--i:0"><span class="ico">👤</span> Hồ Sơ Của Tớ</button>
      <button class="stack-btn glass" data-panel="wishes" style="--i:1"><span class="ico">💌</span> Lời Chúc</button>
      <button class="stack-btn glass" data-panel="gallery" style="--i:2"><span class="ico">📸</span> Khoảnh Khắc</button>
    </div>

    <main class="hero">
      <div class="headline-wrap">
        <h1 class="gold-text">Chúc Mừng Sinh Nhật</h1>
      </div>
      <p class="subtitle">Hôm nay là ngày đặc biệt — cùng đếm ngược nhé 🎈</p>

      <div class="cake-wrap" id="cakeBtn">
        <div class="cake">🎂</div>
        <div class="cake-hint">Chạm vào bánh để gửi lời chúc</div>
      </div>

      <div class="countdown" id="countdown">
        <div class="cd-box glass"><div class="cd-num" id="cdDays">00</div><div class="cd-label">Ngày</div></div>
        <div class="cd-box glass"><div class="cd-num" id="cdHours">00</div><div class="cd-label">Giờ</div></div>
        <div class="cd-box glass"><div class="cd-num" id="cdMins">00</div><div class="cd-label">Phút</div></div>
        <div class="cd-box glass"><div class="cd-num" id="cdSecs">00</div><div class="cd-label">Giây</div></div>
      </div>
      <div class="cd-target" id="cdTarget"></div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-panel" id="modalPanel">
    <div class="modal-inner" id="modalInner"></div>
    <div class="modal-close" id="modalClose">✕</div>
  </div>

<script>
(function(){
  "use strict";

  /* =========================================================
     1) CỔNG VÀO — nhập tên trước khi vào
     ========================================================= */
  const gate = document.getElementById('gate');
  const guestNameInput = document.getElementById('guestNameInput');
  const enterBtn = document.getElementById('enterBtn');
  let guestName = '';

  function enterParty(){
    guestName = guestNameInput.value.trim() || 'Bạn';
    gate.classList.add('hidden');
    startAmbientParticles();
  }
  enterBtn.addEventListener('click', enterParty);
  guestNameInput.addEventListener('keydown', e => { if(e.key === 'Enter') enterParty(); });

  /* =========================================================
     2) HẠT TRÔI — trái tim & bong bóng trắng rơi nhẹ nhàng
     ========================================================= */
  const ambient = document.getElementById('ambient');
  const HEART = ['💗','💕','🤍'];
  let particleTimer = null;

  function spawnParticle(){
    const el = document.createElement('div');
    el.className = 'particle';
    const isHeart = Math.random() < 0.45;
    const size = isHeart ? (14 + Math.random()*14) : (8 + Math.random()*14);
    const left = Math.random()*100;
    const duration = 9 + Math.random()*8;
    const drift = (Math.random()*140 - 70) + 'px';
    const spin = (Math.random()*140 - 70) + 'deg';

    el.style.left = left + 'vw';
    el.style.setProperty('--drift', drift);
    el.style.setProperty('--spin', spin);
    el.style.animation = `fall ${duration}s linear forwards`;

    if(isHeart){
      el.textContent = HEART[Math.floor(Math.random()*HEART.length)];
      el.style.fontSize = size + 'px';
      el.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.08))';
    } else {
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.borderRadius = '50%';
      el.style.background = 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.35))';
      el.style.border = '1px solid rgba(255,255,255,0.8)';
      el.style.boxShadow = '0 2px 10px rgba(255,255,255,0.5)';
    }

    ambient.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000 + 200);
  }

  function startAmbientParticles(){
    if(particleTimer) return;
    for(let i=0;i<6;i++) setTimeout(spawnParticle, i*300);
    particleTimer = setInterval(spawnParticle, 650);
  }

  /* =========================================================
     3) ĐẾM NGƯỢC — đến 31/07
     ========================================================= */
  // 🎯 Đổi ngày mục tiêu ở đây nếu cần
  const TARGET = new Date(2026, 6, 31, 0, 0, 0); // Tháng 7 = index 6

  const cdDays = document.getElementById('cdDays');
  const cdHours = document.getElementById('cdHours');
  const cdMins = document.getElementById('cdMins');
  const cdSecs = document.getElementById('cdSecs');
  const cdTarget = document.getElementById('cdTarget');

  cdTarget.textContent = 'Hướng tới 31/07/' + TARGET.getFullYear();

  function pad(n){ return String(n).padStart(2,'0'); }

  function updateCountdown(){
    const diff = TARGET - new Date();
    if(diff <= 0){
      cdDays.textContent = '00'; cdHours.textContent = '00';
      cdMins.textContent = '00'; cdSecs.textContent = '00';
      cdTarget.textContent = '🎉 Chúc mừng sinh nhật! 🎉';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    cdDays.textContent = pad(d);
    cdHours.textContent = pad(h);
    cdMins.textContent = pad(m);
    cdSecs.textContent = pad(s);
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  /* =========================================================
     4) LỜI CHÚC — lưu tạm trong phiên làm việc
     ========================================================= */
  let wishes = [
    { name: 'Ban Tổ Chức', msg: 'Chúc bạn một tuổi mới thật nhiều niềm vui và may mắn! 🎉' }
  ];

  function renderWishList(){
    if(wishes.length === 0) return '<div class="wish-empty">Chưa có lời chúc nào — hãy là người đầu tiên! 💌</div>';
    return wishes.map(w => `
      <div class="wish-item">
        <div class="wish-name">${escapeHtml(w.name)}</div>
        <div class="wish-msg">${escapeHtml(w.msg)}</div>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* =========================================================
     5) NỘI DUNG PANEL (Hồ sơ / Lời chúc / Khoảnh khắc / Gửi lời chúc)
     ========================================================= */
  function profileContent(){
    return `
      <div class="profile-avatar">🥳</div>
      <div class="profile-name">Tên Bạn Ở Đây</div>
      <div class="profile-role">Nhân vật chính của bữa tiệc hôm nay</div>
      <div class="profile-line"><span>Ngày đặc biệt</span><span>31 · 07</span></div>
      <div class="profile-line"><span>Lời chúc đã nhận</span><span id="wishCountStat">${wishes.length}</span></div>
      <div class="profile-line"><span>Khách đang xem</span><span>${escapeHtml(guestName)}</span></div>
      <p style="margin-top:16px;font-size:12.5px;color:var(--text-soft);text-align:center;">
        ✏️ Sửa tên & thông tin trong hàm <code>profileContent()</code> ở file HTML.
      </p>
    `;
  }

  function wishesContent(){
    return `
      <div class="wish-list" id="wishListView">${renderWishList()}</div>
    `;
  }

  function galleryContent(){
    return `
      <div class="gallery">
        <div class="gallery-card g1">Khoảnh khắc 1</div>
        <div class="gallery-card g2">Khoảnh khắc 2</div>
        <div class="gallery-card g3">Khoảnh khắc 3</div>
        <div class="gallery-card g4">Khoảnh khắc 4</div>
      </div>
      <p style="margin-top:16px;font-size:12.5px;color:var(--text-soft);text-align:center;">
        📷 Thay các khối màu bằng ảnh thật: <code>background: url('anh.jpg')</code>
      </p>
    `;
  }

  function cakeFormContent(){
    return `
      <div class="wish-form">
        <input class="field" id="cakeNameInput" type="text" placeholder="Tên của bạn" value="${escapeHtml(guestName)}" maxlength="30" style="margin-bottom:0;" />
        <textarea class="field" id="cakeMsgInput" placeholder="Viết lời chúc của bạn..." maxlength="200" style="margin-bottom:0;"></textarea>
        <button class="btn-primary" id="cakeSubmitBtn">Gửi Lời Chúc 🎂</button>
      </div>
      <div class="wish-list" id="cakeWishList">${renderWishList()}</div>
    `;
  }

  const PANELS = {
    profile: { title: 'Hồ Sơ Của Tớ', sub: 'Vài điều nho nhỏ về nhân vật chính hôm nay', render: profileContent },
    wishes:  { title: 'Lời Chúc Từ Mọi Người', sub: `${wishes.length} lời chúc đã gửi đến`, render: wishesContent },
    gallery: { title: 'Khoảnh Khắc Đáng Nhớ', sub: 'Những kỷ niệm đẹp nhất', render: galleryContent },
    cake:    { title: 'Gửi Lời Chúc 💌', sub: 'Viết vài dòng thật ấm áp nhé', render: cakeFormContent }
  };

  /* =========================================================
     6) MODAL: hiệu ứng FLIP — bay từ nút ra giữa & phóng to
     ========================================================= */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalPanel = document.getElementById('modalPanel');
  const modalInner = document.getElementById('modalInner');
  const modalClose = document.getElementById('modalClose');
  let originRect = null;
  let originEl = null;

  function openPanel(key, triggerEl){
    const panel = PANELS[key];
    originEl = triggerEl;
    originRect = triggerEl.getBoundingClientRect();

    modalInner.innerHTML = `
      <div class="modal-title">${panel.title}</div>
      <div class="modal-sub">${panel.sub}</div>
      ${panel.render()}
    `;

    if(key === 'cake') wireCakeForm();

    // vị trí ban đầu = đúng vị trí & kích thước của nút/bánh
    modalPanel.style.transition = 'none';
    modalPanel.style.left = originRect.left + 'px';
    modalPanel.style.top = originRect.top + 'px';
    modalPanel.style.width = originRect.width + 'px';
    modalPanel.style.height = originRect.height + 'px';
    modalPanel.style.borderRadius = '18px';
    modalPanel.classList.add('show');
    modalOverlay.classList.add('show');
    if(triggerEl.classList) triggerEl.classList.add('launching');

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const w = Math.min(480, window.innerWidth * 0.9);
        const h = Math.min(560, window.innerHeight * 0.82);
        modalPanel.style.transition = 'left .55s cubic-bezier(.2,.85,.25,1), top .55s cubic-bezier(.2,.85,.25,1), width .55s cubic-bezier(.2,.85,.25,1), height .55s cubic-bezier(.2,.85,.25,1), border-radius .5s ease';
        modalPanel.style.left = (window.innerWidth/2 - w/2) + 'px';
        modalPanel.style.top = (window.innerHeight/2 - h/2) + 'px';
        modalPanel.style.width = w + 'px';
        modalPanel.style.height = h + 'px';
        modalPanel.style.borderRadius = '26px';
      });
    });
  }

  function closePanel(){
    if(!originRect) return;
    modalPanel.style.transition = 'left .45s cubic-bezier(.4,0,.2,1), top .45s cubic-bezier(.4,0,.2,1), width .45s cubic-bezier(.4,0,.2,1), height .45s cubic-bezier(.4,0,.2,1), border-radius .4s ease, opacity .4s ease';
    modalPanel.style.left = originRect.left + 'px';
    modalPanel.style.top = originRect.top + 'px';
    modalPanel.style.width = originRect.width + 'px';
    modalPanel.style.height = originRect.height + 'px';
    modalPanel.style.borderRadius = '18px';
    modalPanel.style.opacity = '0';
    modalOverlay.classList.remove('show');

    setTimeout(() => {
      modalPanel.classList.remove('show');
      modalPanel.style.opacity = '';
      if(originEl && originEl.classList) originEl.classList.remove('launching');
    }, 420);
  }

  modalOverlay.addEventListener('click', closePanel);
  modalClose.addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });

  /* -- 3 nút xếp chồng góc phải -- */
  document.querySelectorAll('.stack-btn').forEach(btn => {
    btn.addEventListener('click', () => openPanel(btn.dataset.panel, btn));
  });

  /* -- bánh kem ở giữa -- */
  document.getElementById('cakeBtn').addEventListener('click', function(){
    openPanel('cake', this);
  });

  /* -- gửi lời chúc từ form trong bánh kem -- */
  function wireCakeForm(){
    const btn = document.getElementById('cakeSubmitBtn');
    if(!btn) return;
    btn.addEventListener('click', () => {
      const nameInput = document.getElementById('cakeNameInput');
      const msgInput = document.getElementById('cakeMsgInput');
      const name = nameInput.value.trim() || 'Ẩn danh';
      const msg = msgInput.value.trim();
      if(!msg) { msgInput.focus(); return; }
      wishes.unshift({ name, msg });
      msgInput.value = '';
      document.getElementById('cakeWishList').innerHTML = renderWishList();
      spawnConfetti();
    });
  }

  /* =========================================================
     7) HIỆU ỨNG NHỎ KHI GỬI LỜI CHÚC — thả thêm vài trái tim
     ========================================================= */
  function spawnConfetti(){
    for(let i=0;i<14;i++) setTimeout(spawnParticle, i*60);
  }

})();
</script>
</body>
</html>
